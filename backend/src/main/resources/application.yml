server:
  port: 8080

spring:
  application:
    name: campus-activity-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pbl6?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.activity.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: campus-activity-platform-secret-key-2024-very-long-secret
  expiration: 86400000

ai:
  ark:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ${ARK_API_KEY:}

rag:
  script-path: ${RAG_SCRIPT_PATH:../campus-rag/main.py}
  python: ${RAG_PYTHON:python}
  port: ${RAG_PORT:9001}

logging:
  level:
    com.campus.activity: debug
